<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iPhone Calculator</title>

    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111;
        color: #fff;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at top, #444 0%, #111 55%);
      }

      #app {
        width: min(420px, 100vw - 32px);
        padding: 20px;
      }

      .calculator {
        background: #000;
        border-radius: 40px;
        padding: 24px 18px 16px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      }

      .display {
        min-height: 110px;
        color: #fff;
        text-align: right;
        font-size: 4rem;
        letter-spacing: -0.05em;
        padding: 24px 16px 8px;
        word-break: break-all;
      }

      .status-line {
        text-align: right;
        font-size: 1.1rem;
        color: #888;
        padding: 0 16px 10px;
        min-height: 20px;
      }

      .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
      }

      .button {
        border: none;
        border-radius: 100px;
        font-size: 1.6rem;
        font-weight: 600;
        padding: 18px 0;
        cursor: pointer;
        transition:
          transform 0.12s ease,
          background 0.12s ease;
      }

      .button:active {
        transform: scale(0.96);
      }

      .button.function {
        background: #333;
        color: #fff;
      }

      .button.operator {
        background: #ff9f0a;
        color: #000;
      }

      .button.number {
        background: #1c1c1c;
        color: #fff;
      }

      .button.zero {
        grid-column: span 2;
        text-align: left;
        padding-left: 36px;
      }

      /* Calculation History */
      .history {
        max-height: 120px;
        overflow-y: auto;
        text-align: right;
        font-size: 0.9rem;
        color: #777;
        padding: 0 16px 10px;
      }

      .history-item {
        padding: 3px 0;
        border-bottom: 1px solid #222;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <div id="app"></div>

    <script src="script.js"></script>
  </body>
</html>
